<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preposizioni — Il Gioco</title>
<style>
  :root{
    --paper:#F7F1E4;
    --paper-line:#E7DCC3;
    --margin-red:#B23A2E;
    --margin-red-soft:#c95c4f;
    --ink:#2A2318;
    --ink-soft:#75695670;
    --ink-soft2:#6E6350;
    --stamp-green:#2F6F4E;
    --gold:#B8862E;
    --card-bg:#FFFDF7;
    --shadow: 0 3px 14px rgba(40,30,10,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background-color:var(--paper);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    padding:32px 16px 60px;
  }
  h1,h2,h3{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    margin:0 0 4px;
  }
  #app{max-width:960px;margin:0 auto;}
  header.top{
    text-align:center;
    margin-bottom:26px;
  }
  header.top h1{font-size:2.3rem;letter-spacing:.3px;margin-bottom:14px;}
  header.top .accent{color:var(--ink);}

  .sheet{
    background:var(--card-bg);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:28px 28px 26px 28px;
    position:relative;
    text-align:center;
  }
  .sheet + .sheet{margin-top:18px;}

  /* Page layout: main box (left) + points/leaderboard column (right) + full-width footer row */
  .layout{
    display:grid;
    grid-template-columns: 1fr 300px;
    gap:20px;
    align-items:stretch;
  }
  .layout-main{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;}
  .layout-main .sheet{flex:1;}
  .layout-points{grid-column:2;grid-row:1;display:flex;gap:20px;}
  .layout-points .sheet{flex:1;}
  .layout-leaderboard{grid-column:2;grid-row:2;display:flex;}
  .layout-leaderboard .sheet{flex:1;}
  .layout-leaderboard.solo{grid-row:1/3;}
  .layout-footer{grid-column:1/3;grid-row:3;}

  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
    .layout-main, .layout-points, .layout-leaderboard, .layout-footer{
      grid-column:1;grid-row:auto;
    }
  }

  /* Intro screen */
  .intro-sheet{
    text-align:center;
    padding:36px 28px;
  }
  .intro-menu{
    max-width:400px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .accordion-header{
    font-family:Georgia,serif;
    font-size:1.05rem;
    font-weight:700;
    color:var(--ink);
    letter-spacing:.3px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px 16px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    background:transparent;
    cursor:pointer;
  }
  .accordion-header:hover{background:var(--paper-line);}
  .accordion-chevron{
    display:inline-block;
    transition:transform .2s ease;
    font-size:.85rem;
  }
  .accordion-header.expanded .accordion-chevron{transform:rotate(180deg);}
  .accordion-content{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .accordion-content.open{max-height:600px;}
  .intro-levels{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-top:10px;
  }
  .level-select-btn{
    font-family:inherit;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:10px 16px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .level-btn-title{font-size:.98rem;font-weight:700;}
  .level-btn-desc{font-size:.78rem;font-weight:400;opacity:.75;}
  .level-select-btn:hover{background:var(--ink);color:var(--paper);}
  .start-game-btn{
    font-family:inherit;
    font-size:.98rem;
    font-weight:700;
    padding:10px 16px;
    border-radius:8px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:background .15s ease;
  }
  .start-game-btn:hover{background:#3a2f1e;}

  /* Progression bar (overall run progress: Level 1 -> ... -> Endless) */
  .level-bar-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .level-bar-row .progression-bar{
    flex:1 1 auto;
    margin-bottom:0;
    min-width:0;
  }
  .cheat-box-mini{
    flex:0 0 auto;
    width:48px;height:48px;
    border-radius:10px;
    border:none;
    background:var(--card-bg);
    box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;
    cursor:pointer;
    color:var(--ink);
    padding:0;
  }
  .cheat-box-mini:hover{background:var(--paper-line);}
  .cheat-box-mini.active{background:var(--ink);color:var(--paper);}
  .cheat-box-mini.active:hover{background:var(--ink);}

  .progression-bar{
    display:flex;
    align-items:flex-start;
    margin-bottom:18px;
    padding:0 4px;
  }
  .prog-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:0 0 auto;
  }
  .prog-dot{
    width:28px;height:28px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:.82rem;font-weight:700;
    border:2px solid var(--paper-line);
    background:var(--card-bg);
    color:var(--ink-soft2);
    transition:all .25s ease;
  }
  .prog-node.prog-current .prog-dot{
    background:var(--gold);border-color:var(--gold);color:var(--card-bg);
    box-shadow:0 0 0 4px rgba(184,134,38,0.2);
  }
  .prog-node.prog-done .prog-dot{
    background:var(--stamp-green);border-color:var(--stamp-green);color:var(--card-bg);
  }
  .prog-label{
    margin-top:6px;font-size:.72rem;text-align:center;
    color:var(--ink-soft2);max-width:64px;line-height:1.2;
  }
  .prog-node.prog-current .prog-label{color:var(--ink);font-weight:700;}
  .prog-node.prog-done .prog-label{color:var(--stamp-green);}
  .prog-connector{
    flex:1 1 auto;height:2px;background:var(--paper-line);
    margin-top:14px;
    transition:background .25s ease;
  }
  .prog-connector.prog-connector-done{background:var(--stamp-green);}

  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn{
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:12px 26px;
    font-size:1rem;
    border-radius:6px;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:hover{transform:translateY(-1px);background:#3a2f1e;}
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
  }
  .btn.secondary:hover{background:var(--ink);color:var(--paper);}
  .btn.red{background:var(--margin-red);}
  .btn.red:hover{background:var(--margin-red-soft);}

  /* Progress header */
  .progress-row{
    display:flex;justify-content:center;align-items:center;
    margin-bottom:14px;flex-wrap:wrap;gap:8px;
  }
  .progress-row .stage-title{font-weight:700;font-size:1.05rem;}
  .progress-bar{
    height:6px;background:var(--paper-line);border-radius:3px;overflow:hidden;margin-bottom:22px;
  }
  .progress-bar .fill{
    height:100%;background:var(--gold);transition:width .3s ease;
  }

  /* Score box */
  .score-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--card-bg);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:18px 20px;
    height:100%;
    text-align:center;
  }
  .split-score-box{
    flex-direction:row;
    padding:0;
  }
  .score-half{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14px 10px;
  }
  .score-divider{width:1px;background:var(--paper-line);}
  .mistake-note{
    color:var(--stamp-green);
    font-size:.92rem;
    margin:10px 0;
  }
  .difficulty-row{
    display:flex;
    gap:8px;
  }
  .difficulty-toggle-btn{
    flex:1;
    font-family:inherit;
    font-size:.92rem;
    font-weight:700;
    padding:10px 8px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .difficulty-toggle-btn:hover{background:var(--paper-line);}
  .difficulty-toggle-btn.active{background:var(--ink);color:var(--paper);}
  .score-value{
    font-family:Georgia,serif;font-weight:700;font-size:2.1rem;
    color:var(--ink);line-height:1;
  }
  .score-label{
    font-size:.68rem;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--ink-soft2);margin-top:5px;
  }
  @keyframes scoreBump{
    0%{transform:scale(1);}
    40%{transform:scale(1.35);color:var(--gold);}
    100%{transform:scale(1);}
  }
  .score-value.score-bump{animation:scoreBump .5s ease-out;}

  /* Question card */
  .sentence{
    font-size:1.3rem;line-height:2;font-family:Georgia,serif;
    margin:6px 0 20px;
  }
  .blank-input{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:700;
    text-align:center;
    color:var(--margin-red);
    border:none;
    border-bottom:2px dashed var(--ink-soft2);
    background:transparent;
    width:110px;
    padding:2px 4px;
    margin:0 3px;
    outline:none;
    vertical-align:baseline;
  }
  .blank-input:focus{border-bottom-color:var(--margin-red);}
  .static-blank{
    display:inline-block;
    min-width:50px;
    font-size:1.05rem;
    line-height:1;
    vertical-align:baseline;
    font-weight:700;
    color:var(--ink-soft2);
    border-bottom:2px dashed var(--ink-soft2);
    padding:2px 8px;
    margin:0 3px;
  }

  .options{
    display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;justify-content:center;
  }
  .opt-btn{
    background:var(--card-bg);
    border:2px solid var(--ink);
    color:var(--ink);
    padding:10px 20px;
    font-size:1rem;
    font-weight:600;
    border-radius:8px;
  }
  .opt-btn:hover{background:var(--ink);color:var(--paper);}
  .opt-btn:disabled{opacity:.5;cursor:default;}

  .submit-row{margin-top:18px;}

  /* Level 5: simplice vs articolata classification */
  .classify-prep-label{
    font-size:.95rem;color:var(--ink-soft2);margin-bottom:10px;
  }
  .classify-prep-label strong{color:var(--margin-red);letter-spacing:.5px;}
  .classify-options{margin-top:16px;}
  .classify-confirm{
    color:var(--stamp-green);font-weight:700;font-size:1.02rem;margin:14px 0 6px;
  }
  .classify-instruction{color:var(--ink-soft2);font-size:.92rem;margin-bottom:10px;}
  .classify-form-input{margin:6px 0 14px;display:block;margin-left:auto;margin-right:auto;}

  /* Feedback */
  .feedback{margin-top:22px;padding-top:18px;border-top:2px solid var(--paper-line);}
  .stamp{
    display:inline-block;
    font-family:"Segoe Print","Bradley Hand",cursive;
    font-size:1.5rem;
    font-weight:700;
    padding:4px 18px;
    border:3px solid;
    border-radius:8px;
    transform:rotate(-4deg);
    animation:stampIn .35s ease-out;
    margin-bottom:14px;
  }
  .stamp-ok{color:var(--stamp-green);border-color:var(--stamp-green);}
  .stamp-no{color:var(--margin-red);border-color:var(--margin-red);transform:rotate(3deg);}
  @keyframes stampIn{
    0%{opacity:0;transform:scale(1.6) rotate(-15deg);}
    70%{opacity:1;}
    100%{opacity:1;transform:scale(1) rotate(-4deg);}
  }
  .feedback p{margin:6px 0;line-height:1.5;}
  .correct-answer{font-size:1.02rem;}
  .full-sentence{
    font-family:Georgia,serif;font-style:italic;font-size:1.1rem;
    color:var(--ink);
  }
  .speak-btn{
    background:transparent;
    border:none;
    padding:0;
    margin:0 8px 0 0;
    cursor:pointer;
    color:var(--ink-soft2);
    vertical-align:-6px;
    display:inline-flex;
    align-items:center;
    line-height:1;
  }
  .speak-btn:hover{color:var(--ink);}
  .speak-btn svg{display:block;}
  .rule-it{font-size:1.02rem;}
  .rule-en{color:var(--ink-soft2);font-size:.95rem;}
  .translation{color:var(--ink-soft2);font-size:.95rem;}
  .other-options{
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed var(--paper-line);
  }
  .other-options-heading{
    font-weight:700;
    font-size:.92rem;
    color:var(--ink-soft2);
    margin:0 0 8px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .other-option{
    background:#FBF3DE;
    border-left:3px solid var(--gold);
    padding:8px 12px;
    border-radius:4px;
    font-size:.92rem;
    margin-bottom:8px;
  }
  .other-option:last-child{margin-bottom:0;}
  .other-option-word{
    font-weight:700;
    color:var(--margin-red);
    margin:0 0 4px;
  }
  .other-option .full-sentence,
  .other-option .rule-it,
  .other-option .rule-en,
  .other-option .translation{
    margin:4px 0;
  }

  .next-row{margin-top:18px;}

  /* Leaderboard */
  .leaderboard h3{font-size:1.05rem;margin-bottom:10px;}
  .reset-scores-btn{
    display:block;
    width:100%;
    font-family:inherit;
    font-size:.78rem;
    font-weight:600;
    padding:6px 10px;
    margin-bottom:12px;
    border-radius:6px;
    border:1px solid var(--ink-soft2);
    background:transparent;
    color:var(--ink-soft2);
    cursor:pointer;
  }
  .reset-scores-btn:hover{background:var(--paper-line);color:var(--ink);}
  .reset-confirm{
    margin-bottom:14px;
    padding:10px;
    border-radius:8px;
    background:var(--paper-line);
  }
  .reset-confirm-text{font-size:.85rem;margin:0 0 8px;color:var(--ink);}
  .reset-confirm-buttons{display:flex;flex-direction:column;gap:6px;}
  .reset-confirm-btn{
    font-family:inherit;
    font-size:.8rem;
    font-weight:600;
    padding:6px 10px;
    border-radius:6px;
    border:1px solid var(--ink);
    background:var(--card-bg);
    color:var(--ink);
    cursor:pointer;
  }
  .reset-confirm-btn:hover{background:var(--ink);color:var(--paper);}
  .reset-all-btn{border-color:var(--margin-red);color:var(--margin-red);}
  .reset-all-btn:hover{background:var(--margin-red);color:var(--paper);}
  .leaderboard ol{margin:0;padding-left:22px;}
  .leaderboard li{
    margin-bottom:10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .lb-name-row{width:100%;}
  .lb-info-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;}
  .lb-name{font-weight:700;}
  .lb-score{color:var(--ink);}
  .lb-stage{
    background:var(--paper-line);
    color:var(--ink-soft2);
    font-size:.78rem;
    font-weight:600;
    padding:1px 8px;
    border-radius:10px;
  }
  .lb-date{color:var(--ink-soft2);font-size:.85rem;}
  .leaderboard .empty{color:var(--ink-soft2);font-style:italic;}

  /* Revision-mode stats (replaces the leaderboard while revising) */
  .revision-stats h3{font-size:1.05rem;margin-bottom:10px;}
  .revision-stat-row{display:flex;gap:8px;}
  .revision-stat{
    flex:1;
    display:flex;flex-direction:column;align-items:center;
    background:var(--paper-line);
    border-radius:8px;
    padding:10px 4px;
  }
  .revision-stat-value{
    font-family:Georgia,serif;font-weight:700;font-size:1.4rem;
    color:var(--ink);line-height:1;
  }
  .revision-stat-label{
    font-size:.66rem;text-transform:uppercase;letter-spacing:.8px;
    color:var(--ink-soft2);margin-top:4px;text-align:center;
  }

  /* Game over */
  .gameover-score{font-size:1.15rem;margin:14px 0 4px;}
  .gameover-note{color:var(--ink-soft2);font-size:.92rem;}
  .top5-note{
    color:var(--gold);font-weight:700;font-size:1rem;
    margin:10px 0 16px;
  }
  .name-entry-row{
    display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center;
  }
  .name-entry-row input{
    flex:1 1 200px;
    font-family:inherit;font-size:1rem;
    padding:11px 14px;
    border:1.5px solid var(--paper-line);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
  }
  .name-entry-row input:focus{border-color:var(--gold);}
  .skip-btn{margin-top:12px;font-size:.9rem;padding:8px 20px;}
  .save-status{font-size:.88rem;margin:8px 0;}
  .save-status.ok{color:var(--stamp-green);font-weight:600;}
  .save-status.warn{color:var(--ink-soft2);font-style:italic;}

  /* Cheat sheet */
  .cheatsheet h3{margin-bottom:16px;}
  .cheatsheet-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px 28px;
  }
  .cheatsheet-item{
    border-left:3px solid var(--gold);
    padding-left:12px;
  }
  .cheatsheet-item h4{
    margin:0 0 6px;
    font-family:Georgia,serif;
    color:var(--margin-red);
    font-size:1.05rem;
    letter-spacing:.5px;
  }
  .cheatsheet-item ul{margin:0;padding-left:18px;text-align:left;}
  .cheatsheet-item li{margin-bottom:4px;font-size:.92rem;line-height:1.4;}

  @media (max-width:480px){
    header.top h1{font-size:1.6rem;}
    .sheet{padding:20px 16px 20px 20px;}
    .sentence{font-size:1.1rem;}
    .blank-input{width:90px;}
    .cheatsheet-grid{grid-template-columns:1fr;}
    .intro-sheet{padding:40px 18px;}
    .prog-dot{width:22px;height:22px;font-size:.7rem;}
    .prog-label{font-size:.62rem;max-width:48px;}
    .prog-connector{margin-top:11px;}
    .name-entry-row{flex-direction:column;}
    .name-entry-row input{flex:1 1 auto;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATA
   ========================================================= */

const levelAVPool = [ // Level 1 (new) — andare/venire + in/a/da, MC, 50 items
  {
    sentence: "Vado sempre {0} bagno prima di uscire di casa.",

  {

/* =========================================================
   ONLINE LEADERBOARD (GitHub-backed)
   =========================================================
   This game is a static page, so it can't run its own server. To share a
   leaderboard across everyone who plays, it reads and writes a small JSON
   file in a GitHub repo using the GitHub REST API directly from the browser.

   IMPORTANT — read before filling this in:
   Anything in this file is visible to anyone who views the page source,
   including this token. For that reason:
     1. Use a SEPARATE, low-stakes repo that holds ONLY leaderboard.json —
        never your main game/site repo.
     2. Create a fine-grained personal access token scoped to ONLY that
        repo, with ONLY the "Contents: Read and write" permission checked.
     3. If you ever suspect it's been misused, just delete/regenerate the
        token from github.com/settings/tokens — the blast radius is limited
        to that one small repo.
   Leave `token` empty to keep the game fully working with a local-only
   leaderboard (no online sync, nothing sent anywhere).
   ========================================================= */
const GITHUB_CONFIG = {
  owner: "",   // your GitHub username or org, e.g. "rorysmith"
  repo: "",    // the DEDICATED leaderboard repo, e.g. "prepizioni-leaderboard"
  branch: "main",
  path: "leaderboard.json",
  token: ""    // fine-grained PAT, scoped ONLY to the repo above, Contents: Read/write
};

function isGitHubConfigured(){
  return !!(GITHUB_CONFIG.owner && GITHUB_CONFIG.repo);
}

/* Local persistence — works immediately with no setup, on this browser only.
   This is what keeps your scores between visits even before (or without)
   configuring GitHub sync above. GitHub sync, when configured, is layered
   on top to additionally share the leaderboard across devices/players. */
const LOCAL_LEADERBOARD_KEY = "prepizioni_leaderboard_v2";
const LOCAL_LEADERBOARD_KEY_LEGACY = "prepizioni_leaderboard_v1";

function emptyLeaderboards(){
  return { easy: [], medium: [], hard: [] };
}

function loadLocalLeaderboard(){
  try{
    const raw = localStorage.getItem(LOCAL_LEADERBOARD_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return {
        easy: Array.isArray(parsed.easy) ? parsed.easy : [],
        medium: Array.isArray(parsed.medium) ? parsed.medium : [],
        hard: Array.isArray(parsed.hard) ? parsed.hard : []
      };
    }
    // no v2 data yet — check for a pre-difficulty leaderboard (always hard-mode,
    // since that was the only mode that used to save scores) and carry it forward
    const legacyRaw = localStorage.getItem(LOCAL_LEADERBOARD_KEY_LEGACY);
    if(legacyRaw){
      const legacyParsed = JSON.parse(legacyRaw);
      return {
        easy: [],
        medium: [],
        hard: Array.isArray(legacyParsed) ? legacyParsed : []
      };
    }
    return emptyLeaderboards();
  } catch(err){
    console.warn("Could not read the local leaderboard:", err);
    return emptyLeaderboards();
  }
}

function saveLocalLeaderboard(){
  try{
    localStorage.setItem(LOCAL_LEADERBOARD_KEY, JSON.stringify(game.leaderboards));
  } catch(err){
    console.warn("Could not save the local leaderboard:", err);
  }
}

function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}

function base64ToUtf8(str){
  return decodeURIComponent(escape(atob(str.replace(/\n/g, ""))));
}

async function fetchRemoteLeaderboard(){
  if(!isGitHubConfigured()) return;
  try{
    const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?ref=${GITHUB_CONFIG.branch}`;
    const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
    if(res.status === 404){
      game.leaderboardSha = null;
      game.leaderboards = emptyLeaderboards();
      return;
    }
    if(!res.ok) throw new Error("GitHub fetch failed: " + res.status);
    const data = await res.json();
    game.leaderboardSha = data.sha;
    const parsed = JSON.parse(base64ToUtf8(data.content));
    game.leaderboards = {
      easy: Array.isArray(parsed.easy) ? parsed.easy : [],
      medium: Array.isArray(parsed.medium) ? parsed.medium : [],
      hard: Array.isArray(parsed.hard) ? parsed.hard : []
    };
  } catch(err){
    console.warn("Could not load the online leaderboard, starting empty:", err);
  }
}

async function saveRemoteLeaderboard(){
  if(!isGitHubConfigured() || !GITHUB_CONFIG.token) return {ok:false, reason:"not-configured"};
  try{
    const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
    const body = {
      message: "Update prepositions game leaderboard",
      content: utf8ToBase64(JSON.stringify(game.leaderboards, null, 2)),
      branch: GITHUB_CONFIG.branch
    };
    if(game.leaderboardSha) body.sha = game.leaderboardSha;
    const res = await fetch(url, {
      method: "PUT",
      headers: {
        "Accept": "application/vnd.github+json",
        "Authorization": `Bearer ${GITHUB_CONFIG.token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error("GitHub save failed: " + res.status);
    const data = await res.json();
    game.leaderboardSha = data.content.sha;
    return {ok:true};
  } catch(err){
    console.warn("Could not save to the online leaderboard (kept locally instead):", err);
    return {ok:false, reason:"error"};
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function normalize(s){
  return (s||"")
    .trim()
    .toLowerCase()
    .replace(/[’‘´`]/g,"'")
    .replace(/\s+/g," ");
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function speakItalian(text){
  if(!("speechSynthesis" in window) || !text) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const itVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("it"));
  if(itVoice) utter.voice = itVoice;
  utter.lang = "it-IT";
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

}

function animateScoreCountUp(from, to){
  if(scoreAnimFrameId) cancelAnimationFrame(scoreAnimFrameId);
  const el = document.getElementById("scoreValue");
  if(!el) return;
  if(from === to){ el.textContent = to; return; }
  const duration = 450;
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    el.textContent = Math.round(from + (to - from) * eased);
    if(t < 1){
      scoreAnimFrameId = requestAnimationFrame(step);
    } else {
      el.textContent = to;
      scoreAnimFrameId = null;
    }
  }
  scoreAnimFrameId = requestAnimationFrame(step);
}

function renderTemplate(template){
  const parts = template.split(/\{(\d+)\}/);
  let html = "";
  for(let i=0;i<parts.length;i++){
    if(i % 2 === 0){
      html += escapeHtml(parts[i]);
    } else {
      html += `<input type="text" class="blank-input" data-idx="${parts[i]}" autocomplete="off" spellcheck="false">`;
    }
  }
  return html;
}

function renderStaticTemplate(template){
  const parts = template.split(/\{(\d+)\}/);
  let html = "";
  for(let i=0;i<parts.length;i++){
    if(i % 2 === 0){
      html += escapeHtml(parts[i]);
    } else {
      html += `<span class="static-blank">&nbsp;</span>`;
    }
  }
  return html;
}

function getRevisionStageInfo(key){
  return stages.find(s => s.key === key);
}

function currentQuestion(){
  if(game.mode === "revision"){
    const stage = getRevisionStageInfo(game.revisionStageKey);
    return {stage, question: game.revisionQueue[game.revisionIndex], isFreestyle: stage.type === "multi"};
  }
  if(game.stageIndex < stages.length){
    const stage = stages[game.stageIndex];
    return {stage, question: stage.questions[game.qIndex], isFreestyle:false};
  }
  if(game.freestyleDeckPos >= game.freestyleDeck.length){
    game.freestyleDeck = shuffle(freestylePool);
    game.freestyleDeckPos = 0;
  }
  return {
    stage: {key:"freestyle", title:"Infinita", type:"multi"},
    question: game.freestyleDeck[game.freestyleDeckPos],
    isFreestyle:true
  };
}

function isLastQuestionOfCurrentStage(){
  if(game.stageIndex >= stages.length) return false;
  return game.qCorrectCount === stages[game.stageIndex].count - 1;
}

function nextStageName(){
  const idx = game.stageIndex + 1;
  if(idx < stages.length) return stages[idx].title;
  return "Infinita";
}

function currentStageLabel(short){
  const s = stages[game.stageIndex];
  if(!s) return "Infinita";
  return short ? s.shortLabel : s.title;
}

function startGame(difficulty){
  game.screen = "question";
  game.mode = "progression";
  game.difficulty = difficulty;
  game.mistakesAllowed = DIFFICULTY_MISTAKES[difficulty];
  game.mistakesLeft = game.mistakesAllowed;
  game.mistakeTolerated = false;
  game.stageIndex = 0;
  game.qIndex = 0;
  game.qCorrectCount = 0;
  stages.forEach(stage => {
    stage.questions = shuffle(stage.pool);
  });
  game.freestyleDeck = shuffle(freestylePool);
  game.freestyleDeckPos = 0;
  game.score = 0;
  game.scoreJustBumped = false;
  game.scoreAnimFrom = 0;
  game.reachedFreestyle = false;
  game.answered = false;
  game.lastCorrect = null;
  game.matchedAlt = null;
  game.classifyPhase = "choose";
  render();
}

function startRevision(key){
  const info = getRevisionStageInfo(key);
  if(!info) return;
  game.mode = "revision";
  game.screen = "question";
  game.revisionStageKey = key;
  game.revisionQueue = shuffle(info.pool);
  game.revisionTotal = game.revisionQueue.length;
  game.revisionIndex = 0;
  game.revisionCorrect = 0;
  game.answered = false;
  game.lastCorrect = null;
  game.matchedAlt = null;
  game.classifyPhase = "choose";
  render();
}

function advanceRevision(){
  if(game.lastCorrect) game.revisionCorrect++;
  game.revisionIndex++;
  game.answered = false;
  game.lastCorrect = null;
  game.matchedAlt = null;
  game.classifyPhase = "choose";
  if(game.revisionIndex >= game.revisionTotal){
    game.screen = "revision-done";
  }
  render();
}

function exitToStart(){
  game.mode = "progression";
  game.screen = "intro";
  game.confirmingReset = false;
  render();
}

function openResetConfirm(){
  game.confirmingReset = true;
  render();
}

function cancelResetConfirm(){
  game.confirmingReset = false;
  render();
}

function persistLeaderboardChange(){
  saveLocalLeaderboard();
  if(isGitHubConfigured()){
    saveRemoteLeaderboard().then(() => render());
  }
}

function resetCurrentModeScores(){
  game.leaderboards[game.selectedDifficulty] = [];
  game.confirmingReset = false;
  persistLeaderboardChange();
  render();
}

function resetAllScores(){
  game.leaderboards = emptyLeaderboards();
  game.confirmingReset = false;
  persistLeaderboardChange();
  render();
}

function advance(){
  game.scoreAnimFrom = game.score;
  game.score++;
  game.scoreJustBumped = true;
  if(game.stageIndex < stages.length){
    game.qCorrectCount++;
    if(game.qCorrectCount >= stages[game.stageIndex].count){
      game.stageIndex++;
      game.qIndex = 0;
      game.qCorrectCount = 0;
      if(game.stageIndex >= stages.length){
        game.reachedFreestyle = true;
      }
    } else {
      game.qIndex++;
      if(game.qIndex >= stages[game.stageIndex].questions.length){
        // exhausted this stage's shuffled deck without yet reaching the required
        // correct count (possible on easy/medium after enough wrong answers) — reshuffle and keep going
        stages[game.stageIndex].questions = shuffle(stages[game.stageIndex].pool);
        game.qIndex = 0;
      }
    }
  } else {
    game.freestyleDeckPos++;
    if(game.freestyleDeckPos >= freestylePool.length){
      triggerGameComplete();
      return;
    }
  }
  game.answered = false;
  game.lastCorrect = null;
  game.matchedAlt = null;
  game.classifyPhase = "choose";
  game.mistakeTolerated = false;
  render();
}

// Like advance(), but for a wrong answer that was tolerated (mistakes still left):
// moves on to the next question without awarding a point, and — crucially — without
// counting toward the correct-answer requirement needed to advance to the next stage.
function advanceAfterMistake(){
  game.mistakesLeft--;
  if(game.stageIndex < stages.length){
    game.qIndex++;
    if(game.qIndex >= stages[game.stageIndex].questions.length){
      stages[game.stageIndex].questions = shuffle(stages[game.stageIndex].pool);
      game.qIndex = 0;
    }
  } else {
    game.freestyleDeckPos++;
    if(game.freestyleDeckPos >= freestylePool.length){
      triggerGameComplete();
      return;
    }
  }
  game.answered = false;
  game.lastCorrect = null;
  game.matchedAlt = null;
  game.classifyPhase = "choose";
  game.mistakeTolerated = false;
  render();
}

const LEADERBOARD_SIZE = 5;

function qualifiesForLeaderboard(score){
  if(score <= 0) return false;
  const board = game.leaderboards[game.difficulty];
  if(board.length < LEADERBOARD_SIZE) return true;
  return score > board[LEADERBOARD_SIZE - 1].score;
}

function triggerGameOver(){
  game.pendingScore = game.score;
  game.pendingStageLabel = currentStageLabel(true);
  game.pendingCompleted = false;
  game.awaitingName = qualifiesForLeaderboard(game.score);
  game.savingStatus = null;
  game.screen = "gameover";
  render();
}

function triggerGameComplete(){
  game.pendingScore = game.score;
  game.pendingStageLabel = "Infinita";
  game.pendingCompleted = true;
  game.awaitingName = qualifiesForLeaderboard(game.score);
  game.savingStatus = null;
  game.screen = "complete";
  render();
}

async function submitLeaderboardName(){
  const input = document.getElementById("nameInput");
  const name = ((input && input.value.trim()) || "Anonimo").slice(0, 30);
  const entry = {
    name,
    score: game.pendingScore,
    stageLabel: game.pendingStageLabel,
    date: new Date().toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }),
    completed: game.pendingCompleted
  };
  const board = game.leaderboards[game.difficulty];
  board.push(entry);
  board.sort((a,b)=> b.score - a.score);
  game.leaderboards[game.difficulty] = board.slice(0, LEADERBOARD_SIZE);
  game.awaitingName = false;
  saveLocalLeaderboard();
  game.savingStatus = isGitHubConfigured() ? "saving" : "local-only";
  render();
  if(isGitHubConfigured()){
    const result = await saveRemoteLeaderboard();
    game.savingStatus = result.ok ? "saved" : "local-only";
    render();
  }
}

function skipLeaderboardName(){
  game.awaitingName = false;
  render();
}

function evaluateBlanks(question, userValues){
  let allCorrect = true;
  let matchedAlt = null;
  question.blanks.forEach((accepted, i) => {
    const val = normalize(userValues[i]);
    const acceptedNorm = accepted.map(normalize);
    if(acceptedNorm.includes(val)) return; // primary/synonym match, fine as-is
    const altGroup = (question.alt || []).find(a => a.blankIndex === i && a.words.map(normalize).includes(val));
    if(altGroup){
      if(!matchedAlt) matchedAlt = altGroup; // first alt match wins if more than one blank uses an alt
      return;
    }
    allCorrect = false;
  });
  return {allCorrect, matchedAlt};
}

// Called whenever a wrong answer happens in progression mode. If there's still
// tolerance left, use one up and let the run continue; otherwise the run ends.
function registerWrongAnswer(){
  return game.mistakesLeft > 0;
}

function checkAnswer(question){
  const inputs = document.querySelectorAll(".blank-input");
  const userValues = Array.from(inputs).map(inp => inp.value);
  const {allCorrect, matchedAlt} = evaluateBlanks(question, userValues);
  game.answered = true;
  game.lastCorrect = allCorrect;
  game.matchedAlt = allCorrect ? matchedAlt : null;
  if(!allCorrect && game.mode === "progression"){
    game.mistakeTolerated = registerWrongAnswer();
  }
  render();
}

function checkMC(question, chosen){
  const {allCorrect, matchedAlt} = evaluateBlanks(question, [chosen]);
  game.answered = true;
  game.lastCorrect = allCorrect;
  game.matchedAlt = allCorrect ? matchedAlt : null;
  if(!allCorrect && game.mode === "progression"){
    game.mistakeTolerated = registerWrongAnswer();
  }
  render();
}

/* Level 5: two-phase interaction — first classify simplice/articolata, then
   (only if articolata) type the specific fused form. */
function checkClassifyChoice(question, choice){
  const guessedArticolata = (choice === "articolata");
  const correct = guessedArticolata === question.isArticulata;
  game.lastCorrect = correct;
  if(!correct){
    game.classifyPhase = "wrong";
    if(game.mode === "progression") game.mistakeTolerated = registerWrongAnswer();
  } else if(question.isArticulata){
    game.classifyPhase = "typeform";
  } else {
    game.classifyPhase = "resolved";
  }
  render();
}

function checkClassifyForm(question){
  const input = document.getElementById("articulateInput");
  const typed = normalize(input ? input.value : "");
  const accepted = question.correctForm.map(normalize);
  const correct = accepted.includes(typed);
  game.lastCorrect = correct;
  game.classifyPhase = correct ? "resolved" : "wrong";
  if(!correct && game.mode === "progression") game.mistakeTolerated = registerWrongAnswer();
  render();
}

    </header>
  `;

  let mainHtml = "";

  if(game.screen === "intro"){
    mainHtml = renderIntro();
  } else if(game.screen === "question"){
    mainHtml = renderQuestionScreen();
    showPoints = true;
  } else if(game.screen === "gameover"){
    mainHtml = renderGameOver();
    showPoints = true;
  } else if(game.screen === "complete"){
    mainHtml = renderGameComplete();
    showPoints = true;
  } else if(game.screen === "revision-done"){
    mainHtml = renderRevisionDone();
    showPoints = true;
  }

  html += `<div class="layout">`;
  html += `<div class="layout-main">${mainHtml}</div>`;
  if(showPoints){
    html += `<div class="layout-points">${renderScoreBox()}</div>`;

  } else {

    secondaryPanel = renderLeaderboard(diffToShow, game.screen === "intro");

  html += `<div class="layout-leaderboard${showPoints ? "" : " solo"}">${secondaryPanel}</div>`;
  if(game.showCheatSheet){
    html += `<div class="layout-footer">${renderCheatSheet()}</div>`;

  html += `</div>`;

  app.innerHTML = html;
  attachHandlers();

  if(game.scoreJustBumped){
    const from = game.scoreAnimFrom;
    const to = game.score;
    game.scoreJustBumped = false;
    animateScoreCountUp(from, to);
  }
}

function renderProgressionBar(){
  const labels = stages.map(s => s.shortLabel).concat(["Infinita"]);
  const total = labels.length;

  if(game.mode === "revision"){
    const currentIdx = stages.findIndex(s => s.key === game.revisionStageKey);
    let html = '<div class="progression-bar">';
    labels.forEach((label, i) => {
      const state = i === currentIdx ? "current" : "upcoming";
      const dotContent = (i === total - 1) ? "∞" : (i+1);
      html += `
        <div class="prog-node prog-${state}">
          <div class="prog-dot">${dotContent}</div>
          <div class="prog-label">${escapeHtml(label)}</div>
        </div>
      `;
      if(i < total - 1) html += `<div class="prog-connector"></div>`;
    });
    html += '</div>';
    return html;
  }

  const currentIdx = Math.min(game.stageIndex, total - 1);
  let html = '<div class="progression-bar">';
  labels.forEach((label, i) => {
    let state = "upcoming";
    if(i < game.stageIndex) state = "done";
    else if(i === currentIdx) state = "current";
    const dotContent = state === "done" ? "✓" : ((i === total - 1) ? "∞" : (i+1));
    html += `
      <div class="prog-node prog-${state}">
        <div class="prog-dot">${dotContent}</div>
        <div class="prog-label">${escapeHtml(label)}</div>
      </div>
    `;
    if(i < total - 1){
      const connDone = i < game.stageIndex ? "prog-connector-done" : "";
      html += `<div class="prog-connector ${connDone}"></div>`;
    }
  });
  html += '</div>';
  return html;
}

function renderClassifyBody(question){
  let body = `
    <p class="classify-prep-label">Preposizione: <strong>${escapeHtml(question.preposition.toUpperCase())}</strong></p>
    <div class="sentence">${renderStaticTemplate(question.sentence)}</div>
  `;

  if(game.classifyPhase === "typeform"){
    body += `
      <p class="classify-confirm">✓ Giusto, è <strong>articolata</strong>!</p>
      <p class="classify-instruction">Ora scrivi la preposizione articolata:</p>
      <input type="text" class="blank-input classify-form-input" id="articulateInput" autocomplete="off" spellcheck="false">
      <div class="submit-row"><button class="btn" id="submitArticulateBtn">Controlla</button></div>
    `;
  } else if(game.classifyPhase === "wrong"){
    body += renderClassifyFeedback(question, false);
    if(game.mode === "revision"){
      const label = (game.revisionIndex === game.revisionTotal - 1) ? "Termina il ripasso →" : "Prossima frase →";
      body += `<div class="next-row"><button class="btn" id="nextBtn">${label}</button></div>`;
    } else if(game.mistakeTolerated){
      body += `<p class="mistake-note">Non preoccuparti, hai ancora qualche errore a disposizione.</p>`;
      body += `<div class="next-row"><button class="btn" id="mistakeContinueBtn">Avanti →</button></div>`;
    } else {
      body += `<div class="next-row"><button class="btn red" id="restartBtn">Ricomincia dall'inizio</button></div>`;
    }
  } else if(game.classifyPhase === "resolved"){
    body += renderClassifyFeedback(question, true);
    const label = game.mode === "revision"
      ? ((game.revisionIndex === game.revisionTotal - 1) ? "Termina il ripasso →" : "Prossima frase →")
      : (isLastQuestionOfCurrentStage() ? `Vai a: ${escapeHtml(nextStageName())} →` : "Avanti →");
    body += `<div class="next-row"><button class="btn" id="nextBtn">${label}</button></div>`;
  } else {
    // "choose" — the default starting phase for every classify question
    body += `
      <div class="options classify-options">
        <button class="opt-btn classify-btn" data-classify-choice="semplice">Semplice</button>
        <button class="opt-btn classify-btn" data-classify-choice="articolata">Articolata</button>
      </div>
    `;
  }

  return body;
}

function renderClassifyFeedback(question, correct){
  const correctLabel = question.isArticulata ? "Articolata" : "Semplice";
  const wrongDetail = !correct
    ? `<p class="correct-answer">Risposta corretta: <strong>${escapeHtml(correctLabel)}</strong>${question.isArticulata ? ` («${escapeHtml(question.correctForm[0])}»)` : ""}</p>`
    : "";
  return `
    <div class="feedback">
      <div class="stamp ${correct ? "stamp-ok" : "stamp-no"}">${correct ? "CORRETTO ✓" : "SBAGLIATO ✗"}</div>
      ${wrongDetail}
      ${renderSpeakableSentence(question.full)}
      <p class="rule-it"><strong>${escapeHtml(question.itExpl)}</strong></p>
      <p class="rule-en">(${escapeHtml(question.enExpl)})</p>
      <p class="translation">English: “${escapeHtml(question.en)}”</p>
    </div>
  `;
}

function renderFeedback(question){
  const correct = game.lastCorrect;
  const correctDisplay = question.blanks.map(b => b[0]).join(" … ");
  const usingAlt = correct && game.matchedAlt;
  const variant = usingAlt ? game.matchedAlt : question;

  let otherOptionsHtml = "";
  if(correct && question.alt && question.alt.length){
    const others = [];
    if(usingAlt){
      // they used an alt for this blank — the primary reading is "the other option"
      others.push({
        word: question.blanks[game.matchedAlt.blankIndex][0],
        full: question.full, en: question.en, itExpl: question.itExpl, enExpl: question.enExpl
      });
    }
    // any alt entries they did NOT use (covers multi-blank sentences with more than one alt)
    question.alt.forEach(a => {
      if(!usingAlt || a !== game.matchedAlt){
        others.push({word: a.words[0], full: a.full, en: a.en, itExpl: a.itExpl, enExpl: a.enExpl});
      }
    });
    if(others.length){
      const heading = others.length === 1 ? "Qui andrebbe bene anche:" : "Qui andrebbero bene anche:";
      otherOptionsHtml = `
        <div class="other-options">
          <p class="other-options-heading">${heading}</p>
          ${others.map(o => `
            <div class="other-option">
              <p class="other-option-word">«${escapeHtml(o.word)}»</p>
              ${renderSpeakableSentence(o.full)}
              <p class="rule-it"><strong>${escapeHtml(o.itExpl)}</strong></p>
              <p class="rule-en">(${escapeHtml(o.enExpl)})</p>
              <p class="translation">English: “${escapeHtml(o.en)}”</p>
            </div>
          `).join("")}
        </div>
      `;
    }
  }

  return `
    <div class="feedback">
      <div class="stamp ${correct ? "stamp-ok" : "stamp-no"}">${correct ? "CORRETTO ✓" : "SBAGLIATO ✗"}</div>
      ${!correct ? `<p class="correct-answer">Risposta corretta: <strong>${escapeHtml(correctDisplay)}</strong></p>` : ""}
      ${renderSpeakableSentence(variant.full)}
      <p class="rule-it"><strong>${escapeHtml(variant.itExpl)}</strong></p>
      <p class="rule-en">(${escapeHtml(variant.enExpl)})</p>
      <p class="translation">English: “${escapeHtml(variant.en)}”</p>
      ${otherOptionsHtml}
    </div>
  `;
}

    rows = board.map(e => `
      <li>
        <div class="lb-name-row"><span class="lb-name">${escapeHtml(e.name || "Anonimo")}</span></div>
        <div class="lb-info-row">
          <span class="lb-score">${e.completed ? "Completo 🏁" : `${e.score} punti`}</span>
          <span class="lb-stage">${escapeHtml(e.stageLabel || "")}</span>
          <span class="lb-date">${escapeHtml(e.date || "")}</span>
        </div>
      </li>
    `).join("");
  }

  let resetSection = "";
  if(allowReset){
    if(game.confirmingReset){
      const modeLabel = escapeHtml(DIFFICULTY_LABELS[difficulty] || difficulty);
      resetSection = `
        <div class="reset-confirm">
          <p class="reset-confirm-text">Sicuro di voler cancellare i punteggi?</p>
          <div class="reset-confirm-buttons">
            <button class="reset-confirm-btn" id="cancelResetBtn">Annulla</button>
            <button class="reset-confirm-btn" id="resetModeBtn">Reset ${modeLabel}</button>
            <button class="reset-confirm-btn reset-all-btn" id="resetAllBtn">Reset tutto</button>
          </div>
        </div>
      `;
    } else {
      resetSection = `<button class="reset-scores-btn" id="openResetConfirmBtn">Reset punteggi</button>`;
    }
  }

  return `
    <div class="sheet leaderboard">
      ${resetSection}
      <h3>🏆 Classifica — ${escapeHtml(DIFFICULTY_LABELS[difficulty] || difficulty)}</h3>
      <ol>${rows}</ol>
    </div>
  `;
}

function renderRevisionStats(){
  const correct = game.revisionCorrect;
  const incorrect = game.revisionIndex - game.revisionCorrect;
  const accuracy = game.revisionIndex > 0 ? Math.round((correct / game.revisionIndex) * 100) : 0;
  return `
    <div class="sheet revision-stats">
      <h3>Statistiche</h3>
      <div class="revision-stat-row">
        <div class="revision-stat">
          <div class="revision-stat-value">${correct}</div>
          <div class="revision-stat-label">Corrette</div>
        </div>
        <div class="revision-stat">
          <div class="revision-stat-value">${incorrect}</div>
          <div class="revision-stat-label">Sbagliate</div>
        </div>
        <div class="revision-stat">
          <div class="revision-stat-value">${accuracy}%</div>
          <div class="revision-stat-label">Precisione</div>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   EVENTS
   ========================================================= */
function attachHandlers(){
  const cheatToggleBtn = document.getElementById("cheatToggleBtn");
  if(cheatToggleBtn) cheatToggleBtn.addEventListener("click", toggleCheatSheet);

  const revisionAccordionToggle = document.getElementById("revisionAccordionToggle");
  if(revisionAccordionToggle) revisionAccordionToggle.addEventListener("click", toggleRevisionMenu);

  document.querySelectorAll(".speak-btn").forEach(btn => {
    btn.addEventListener("click", () => speakItalian(btn.getAttribute("data-speak-text")));
  });

  const startBtn = document.getElementById("startBtn");
  if(startBtn) startBtn.addEventListener("click", () => startGame(game.selectedDifficulty));

  document.querySelectorAll(".difficulty-toggle-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      game.selectedDifficulty = btn.getAttribute("data-difficulty");
      game.confirmingReset = false;
      render();
    });
  });

  const openResetConfirmBtn = document.getElementById("openResetConfirmBtn");
  if(openResetConfirmBtn) openResetConfirmBtn.addEventListener("click", openResetConfirm);

  const cancelResetBtn = document.getElementById("cancelResetBtn");
  if(cancelResetBtn) cancelResetBtn.addEventListener("click", cancelResetConfirm);

  const resetModeBtn = document.getElementById("resetModeBtn");
  if(resetModeBtn) resetModeBtn.addEventListener("click", resetCurrentModeScores);

  const resetAllBtn = document.getElementById("resetAllBtn");
  if(resetAllBtn) resetAllBtn.addEventListener("click", resetAllScores);

  const mistakeContinueBtn = document.getElementById("mistakeContinueBtn");
  if(mistakeContinueBtn) mistakeContinueBtn.addEventListener("click", advanceAfterMistake);

  document.querySelectorAll(".level-select-btn").forEach(btn => {
    btn.addEventListener("click", () => startRevision(btn.getAttribute("data-revision-key")));
  });

  const exitToStartBtn = document.getElementById("exitToStartBtn");
  if(exitToStartBtn) exitToStartBtn.addEventListener("click", exitToStart);

  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", () => {
    if(game.mode === "revision") advanceRevision();
    else advance();
  });

  const restartBtn = document.getElementById("restartBtn");
  if(restartBtn) restartBtn.addEventListener("click", triggerGameOver);

  const saveNameBtn = document.getElementById("saveNameBtn");
  if(saveNameBtn) saveNameBtn.addEventListener("click", submitLeaderboardName);

  const skipNameBtn = document.getElementById("skipNameBtn");
  if(skipNameBtn) skipNameBtn.addEventListener("click", skipLeaderboardName);

  const nameInput = document.getElementById("nameInput");
  if(nameInput){
    nameInput.addEventListener("keydown", e => {
      if(e.key === "Enter") submitLeaderboardName();
    });
    nameInput.focus();
  }

  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn){
    const {question} = currentQuestion();
    submitBtn.addEventListener("click", () => checkAnswer(question));
    document.querySelectorAll(".blank-input").forEach(inp => {
      inp.addEventListener("keydown", e => {
        if(e.key === "Enter") checkAnswer(question);
      });
    });
    const firstInput = document.querySelector(".blank-input");
    if(firstInput) firstInput.focus();
  }

  document.querySelectorAll(".opt-btn:not(.classify-btn)").forEach(btn => {
    btn.addEventListener("click", () => {
      const {question} = currentQuestion();
      document.querySelectorAll(".opt-btn").forEach(b => b.disabled = true);
      checkMC(question, btn.getAttribute("data-choice"));
    });
  });

  document.querySelectorAll(".classify-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const {question} = currentQuestion();
      document.querySelectorAll(".classify-btn").forEach(b => b.disabled = true);
      checkClassifyChoice(question, btn.getAttribute("data-classify-choice"));
    });
  });

  const submitArticulateBtn = document.getElementById("submitArticulateBtn");
  if(submitArticulateBtn){
    const {question} = currentQuestion();
    submitArticulateBtn.addEventListener("click", () => checkClassifyForm(question));
    const articulateInput = document.getElementById("articulateInput");
    if(articulateInput){
      articulateInput.addEventListener("keydown", e => {
        if(e.key === "Enter") checkClassifyForm(question);
      });
      articulateInput.focus();
    }
  }
}

/* =========================================================
   INIT
   ========================================================= */
game.leaderboards = loadLocalLeaderboard();
game.leaderboardLoading = isGitHubConfigured();
render();
if(isGitHubConfigured()){
  fetchRemoteLeaderboard().finally(() => {
    game.leaderboardLoading = false;
    render();
  });
}
</script>
</body>
</html>
